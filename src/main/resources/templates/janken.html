<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Janken</title>
</head>

<body>
  <h1>Janken GAME!</h1>

  <p th:if="${username != null}">
    Hi <span th:text="${username}"></span>
  </p>

  <a href="/jankengame?hand=Gu">グー</a>
  <a href="/jankengame?hand=Choki">チョキ</a>
  <a href="/jankengame?hand=Pa">パー</a>

  <div th:if="${result != null}">
    <p>あなたの手：<span th:text="${myHand}"></span></p>
    <p>相手の手：<span th:text="${cpuHand}"></span></p>
    <p>結果：<span th:text="${result}"></span></p>
  </div>

</body>

</html>
